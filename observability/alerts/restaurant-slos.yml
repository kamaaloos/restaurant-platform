groups:
  - name: restaurant-slos
    rules:
      - alert: PrepLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(restaurant_prep_duration_seconds_bucket[15m])) by (le)
          ) > 900
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Kitchen prep p95 above SLO (15m)
          description: >
            Prep PREPARING→READY p95 is {{ $value | humanizeDuration }}
            (threshold 15m). Check KDS backlog and staffing.

