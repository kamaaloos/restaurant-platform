global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: restaurant-api
    metrics_path: /api/metrics
    static_configs:
      # API runs on the host (Nest :3000). Docker Desktop: host.docker.internal
      - targets: ['host.docker.internal:3000']
